<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso empleados · Estudiamos tu factura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0F172A;font-family:Manrope,sans-serif;color:#0F172A;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;border-radius:26px;padding:44px 38px;box-shadow:0 24px 64px rgba(0,0,0,.25);width:100%;max-width:420px;text-align:center}
.logo{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:16px;padding:12px 20px;display:inline-block;margin-bottom:28px}
.logo img{height:44px;display:block}
h1{font-size:24px;font-weight:800;letter-spacing:-0.01em;margin:0 0 10px}
p{font-size:15px;line-height:1.6;color:#64748B;margin:0 0 28px}
.badge{display:inline-flex;align-items:center;gap:8px;background:#E8F0FE;color:#1677FF;font-size:13.5px;font-weight:700;padding:9px 18px;border-radius:999px;margin-bottom:28px}
a.back{display:inline-block;font-size:14px;font-weight:700;color:#1677FF;text-decoration:none}
a.back:hover{color:#0F172A}
@media(max-width:480px){.card{padding:34px 22px}}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><img src="./assets/logo.png" alt="Estudiamos tu factura"></div>
  <h1>🔒 Acceso empleados</h1>
  <p>El CRM interno se instalará próximamente en esta dirección. Si has llegado aquí por error, vuelve a la página principal.</p>
  <div class="badge">⚙️ CRM en preparación</div>
  <br>
  <a class="back" href="./Landing%20ETF.dc.html">← Volver a la web</a>
</main>
</body>
</html>
